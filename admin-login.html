
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Desa Banyubiru</title>

    <link rel="stylesheet" href="login.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="admin-login.js" defer></script>
</head>
<body>
    <main class="login-page">
        <section class="login-card">
            <div class="logo">✦</div>

            <p class="subtitle">ADMINISTRATOR</p>
            <h1>Desa Banyubiru</h1>
            <p class="description">Masuk ke panel pengelolaan game.</p>

            <form id="adminLoginForm">
                <div class="form-group">
                    <label for="email">Email Admin</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Masukkan email admin"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Kata Sandi</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Masukkan kata sandi"
                        required
                    >
                </div>

                <button type="submit" id="adminLoginButton">
                    MASUK SEBAGAI ADMIN
                </button>

                <p id="adminLoginMessage"></p>
            </form>

            <div class="login-footer">
                Halaman khusus administrator.
            </div>
        </section>
    </main>
</body>
</html>
